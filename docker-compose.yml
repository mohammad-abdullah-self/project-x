services:
  nuxt:
    build:
      context: .
      dockerfile: Dockerfile
    image: nuxt-project-x-dev
    container_name: nuxt_project_x_dev
    volumes:
      - .:/app:delegated
      # persist container node_modules so host OS/Bun mismatch is avoided
      - nuxt_node_modules_dev:/app/node_modules
    environment:
      # make Nuxt/Nitro listen on all interfaces so host can access container
      NITRO_HOST: ${NITRO_HOST}
      NITRO_PORT: ${NITRO_PORT}
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "${NITRO_PORT}:3000"
    depends_on:
      - db
    networks:
      - app-nuxt-dev-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: nuxt_project-x_db_dev
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pg_db_data_dev:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - app-nuxt-dev-network
    restart: unless-stopped

volumes:
  pg_db_data_dev:
  nuxt_node_modules_dev:

networks:
  app-nuxt-dev-network:
    driver: bridge
