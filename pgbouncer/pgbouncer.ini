[databases]
# shorthand: map pgbouncer db name to upstream connection string
# We'll use "system_db" to talk to Postgres system DB and tenant DBs via host:port/dbname
system_db = host=postgres port=5432 dbname=system_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session                ; <<-- IMPORTANT: session for migrations & session-required features
max_client_conn = 1000
default_pool_size = 50
reserve_pool_size = 10
reserve_pool_timeout = 5
server_check_delay = 30
server_check_query = SELECT 1
log_connections = 1
log_disconnections = 1
